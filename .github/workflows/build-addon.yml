name: Build add-on image

# Builds the Home Assistant add-on container image and pushes it to GHCR.
# Home Assistant pulls ghcr.io/tiktack/flamette-money-aarch64:<version>, where <version>
# matches the `version` field in flamette-money/config.yaml.

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "migrations/**"
      - "docker/**"
      - "public/**"
      - "Dockerfile"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"
      - "flamette-money/config.yaml"
      - ".github/workflows/build-addon.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read add-on version
        id: version
        run: |
          version="$(grep -E '^version:' flamette-money/config.yaml | sed -E 's/version:[[:space:]]*"?([^"]+)"?/\1/')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Add-on version: ${version}"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/tiktack/flamette-money-aarch64:${{ steps.version.outputs.version }}
            ghcr.io/tiktack/flamette-money-aarch64:latest
