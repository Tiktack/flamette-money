---
name: Flamette Money
version: "1.0.4"
slug: flamette_money
description: Self-hosted multi-currency personal finance app backed by a local SQLite database.
url: https://github.com/Tiktack/flamette-money
arch:
  - aarch64
image: ghcr.io/tiktack/flamette-money-{arch}
init: false
boot: auto
startup: application
# Stop the add-on during a Home Assistant backup so the SQLite database (WAL mode) is
# snapshotted with no in-flight writes; the graceful-shutdown handler also checkpoints the
# WAL into the main file on stop. This makes /data/flamette-money.db backups consistent.
backup: cold
ports:
  8744/tcp: 8744
ports_description:
  8744/tcp: Web UI / API — point your Cloudflare Tunnel or reverse proxy at this port
webui: http://[HOST]:[PORT:8744]
watchdog: http://[HOST]:[PORT:8744]/api/healthz
options:
  better_auth_secret: ""
  better_auth_url: ""
  better_auth_trusted_origins: ""
  disable_signups: false
  exchange_rate_api_key: ""
  google_client_id: ""
  google_client_secret: ""
  github_client_id: ""
  github_client_secret: ""
  email_import_encryption_key: ""
schema:
  better_auth_secret: password
  better_auth_url: str?
  better_auth_trusted_origins: str?
  better_auth_use_secure_cookies: bool?
  disable_signups: bool?
  exchange_rate_api_key: password?
  google_client_id: str?
  google_client_secret: password?
  github_client_id: str?
  github_client_secret: password?
  email_import_encryption_key: password?
  email_import_default_poll_minutes: int?
  email_import_max_messages_per_sync: int?
