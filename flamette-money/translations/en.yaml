configuration:
  better_auth_secret:
    name: Better Auth secret
    description: Required. A long random string used to sign sessions. Generate one with `openssl rand -base64 32`.
  better_auth_url:
    name: Public app URL
    description: The fixed public origin the app is served from (e.g. https://money.example.com via your Cloudflare Tunnel). Leave empty for plain LAN access.
  better_auth_trusted_origins:
    name: Trusted origins
    description: Comma-separated origins Better Auth should trust for redirects/cookies. Usually the same as the public app URL.
  better_auth_use_secure_cookies:
    name: Force secure cookies
    description: Leave unset to derive automatically from the public URL (https => on). Turn off only when accessing over plain http on the LAN.
  openrouter_api_key:
    name: OpenRouter API key
    description: Optional. Enables AI receipt scanning.
  openrouter_model:
    name: OpenRouter model
    description: Optional model override for receipt scanning.
  exchange_rate_api_key:
    name: Exchange rate API key
    description: Optional. Enables live currency conversion in reports.
  google_client_id:
    name: Google OAuth client ID
    description: Optional. Requires a public https URL.
  google_client_secret:
    name: Google OAuth client secret
    description: Optional. Required if a Google client ID is set.
  github_client_id:
    name: GitHub OAuth client ID
    description: Optional. Requires a public https URL.
  github_client_secret:
    name: GitHub OAuth client secret
    description: Optional. Required if a GitHub client ID is set.
